<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<![CDATA[
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#050506;font-family:'Manrope',sans-serif;} a{color:#FF3B30;text-decoration:none;} a:hover{color:#ff5c53;}</style>
</helmet>
<div style="min-height:100vh; background:#050506;">
  <div style="max-width:1440px; margin:0 auto; background:#09090B; border-left:1px solid #27272A; border-right:1px solid #27272A;">
    <div style="padding:24px 64px; font-family:'Manrope'; font-size:12px; color:#71717A;">Page: /onboarding</div>
    <div style="padding:40px 64px 100px; display:flex; justify-content:center;">
      <div style="width:100%; max-width:480px; display:flex; flex-direction:column; gap:20px;">
        <div style="font-family:'Manrope'; font-weight:700; font-size:12px; letter-spacing:0.1em; color:#71717A;">STEP 1 OF 1 — SET UP YOUR PROFILE</div>
        <h1 style="margin:0; font-family:'Syne'; font-weight:800; font-size:28px; color:#F7F7F5;">Tell us about you</h1>
        <div style="width:88px; height:88px; border-radius:16px; background:repeating-linear-gradient(135deg,#1f1f23,#1f1f23 8px,#18181B 8px,#18181B 16px); align-self:center;"></div>
        <div style="display:flex; flex-direction:column; gap:12px;">
          <div style="background:#18181B; border:1px solid #27272A; border-radius:10px; padding:14px 16px; font-family:'Manrope'; font-size:13px; color:#71717A;">Beatmaker name</div>
          <div style="background:#18181B; border:1px solid #27272A; border-radius:10px; padding:14px 16px; font-family:'Manrope'; font-size:13px; color:#71717A;">Username</div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <sc-for list="{{ genres }}" as="g" hint-placeholder-count="6">
              <span style="font-family:'Manrope'; font-weight:600; font-size:12px; color:#A1A1AA; border:1px solid #27272A; border-radius:100px; padding:8px 14px;">{{ g }}</span>
            </sc-for>
          </div>
        </div>
        <a href="Dashboard.dc.html" style="text-align:center; font-family:'Manrope'; font-weight:700; font-size:15px; color:#F7F7F5; background:#FF3B30; border-radius:8px; padding:16px;">Finish setup</a>
      </div>
    </div>
  </div>

  <!-- MOBILE -->
  <div style="max-width:375px; margin:64px auto; border:1px solid #27272A; border-radius:20px; overflow:hidden; background:#09090B;">
    <div style="font-family:'Manrope'; font-weight:700; font-size:10px; letter-spacing:0.1em; color:#71717A; text-align:center; padding:8px; background:#050506;">MOBILE — /onboarding</div>
    <div style="padding:32px 20px; display:flex; flex-direction:column; gap:16px;">
      <h1 style="margin:0; font-family:'Syne'; font-weight:800; font-size:22px; color:#F7F7F5;">Tell us about you</h1>
      <div style="width:64px; height:64px; border-radius:14px; background:repeating-linear-gradient(135deg,#1f1f23,#1f1f23 8px,#18181B 8px,#18181B 16px); align-self:center;"></div>
      <div style="background:#18181B; border:1px solid #27272A; border-radius:10px; padding:14px; font-family:'Manrope'; font-size:13px; color:#71717A;">Beatmaker name</div>
    </div>
  </div>
</div>
]]>
</x-dc>
<script type="text/x-dc" data-dc-script>
<![CDATA[
class Component extends DCLogic {
  renderVals() { return { genres: ['Trap','R&B','Drill','Boom Bap','Lo-fi','Afrobeats'] }; }
}
]]>
</script>
</body>
</html>
